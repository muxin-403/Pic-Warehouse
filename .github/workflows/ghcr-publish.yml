name: Publish to GHCR

# 构建并推送 linux/amd64 镜像到 GitHub Container Registry。
# 曾同时构建 linux/arm64（单 runner + QEMU），但 arm64 在 QEMU 模拟下
# 反复于 nuxt build 处挂起（2h 超时），现按需移除，仅保留 amd64。
#
# 与本仓库既有的 docker-publish.yml（Docker Hub + 原生 arm runner + 清单合并）互不干扰：
# 那份走 Docker Hub，这份走 GHCR。
#
# 标签命名规则（由 docker/metadata-action 生成，详见下方「计算镜像标签」步骤）：
#   push tag v1.4.1   -> 1.4.1 / 1.4 / sha-<短SHA>
#   push main         -> main / latest / sha-<短SHA>
#   push 其他分支      -> <分支名> / sha-<短SHA>
#   PR                -> pr-<编号>（仅构建 amd64、不推送）
#   workflow_dispatch -> 同 push main，可用 inputs.platforms 覆盖目标平台

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 目标平台（默认 linux/amd64）
        required: false
        default: linux/amd64
        type: string

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  # 分支上的连续推送只保留最新一轮；tag 构建不取消，避免半途中断发布
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io
  # github.repository 形如 O96u/PicHost，而 GHCR 要求镜像名全小写。
  # metadata-action 会自己转小写，但「拉取/校验」用的引用必须同样是小写，所以统一由
  # 各作业的「解析镜像引用」步骤算出小写引用后再使用，不要直接用 ${{ github.repository }} 拼引用。
  IMAGE_NAME: ${{ github.repository }}

# 默认最小权限；只有需要写包的作业单独提权到 packages: write
permissions:
  contents: read

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # 推送 GHCR 必需；若仓库/组织把 Workflow permissions 设为只读，该提权会被拒绝
    outputs:
      pushed: ${{ steps.target.outputs.push }}
      sha_tag: ${{ steps.target.outputs.sha_tag }}
      platforms: ${{ steps.target.outputs.platforms }}
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 解析镜像引用（GHCR 要求全小写）
        id: image
        run: |
          set -eu
          REF="$(printf '%s/%s' "${REGISTRY}" "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${REF}" >> "$GITHUB_ENV"

      - name: 解析构建目标（平台 / 是否推送 / 提交标签）
        id: target
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -eu
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # PR（尤其来自 fork）拿不到 packages:write；且多平台清单无法 load 进本地守护进程，
            # 因此 PR 只构建单平台做「能不能编过」的校验，不推送。
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        # 仅当手动 dispatch 指定了非本机平台（如 arm64）时才需要 binfmt；
        # 默认 amd64 单平台构建会自动跳过本步骤
        if: ${{ contains(steps.target.outputs.platforms, 'arm64') }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        # fork 的 PR 无法写入包，直接跳过登录
        if: steps.target.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规则说明（注意：metadata-action 的 tags 块内不支持 # 注释，说明只能写在这里）：
      #   semver        tag v1.4.1 -> 1.4.1；同时产出 1.4
      #   ref/branch    main -> main
      #   ref/pr        PR -> pr-<编号>（该类型只在 PR 事件自动启用）
      #   sha           每次构建均可回溯到提交 -> sha-<短SHA>
      #   raw latest    仅默认分支产出，指向该分支最新一次构建
      - name: 计算镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.ref }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pic-Warehouse
            org.opencontainers.image.description=自托管图床：Nuxt 管理端、本地磁盘或 S3 兼容存储、服务端 WebP 压缩
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: 构建并推送（buildx）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.target.outputs.platforms }}
          push: ${{ steps.target.outputs.push == 'true' }}
          # 多平台清单无法 load，因此这里恒为 false；镜像验证由 verify 作业拉回来真跑
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pichost
          cache-to: type=gha,mode=max,scope=pichost
          # 保持干净清单：不加 attestation，避免老客户端 pull 时因多出来的架构报错
          provenance: false
          sbom: false

      - name: 写入构建摘要
        if: always()
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 镜像构建结果"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${{ steps.image.outputs.ref }}\` |"
            echo "| 平台 | \`${{ steps.target.outputs.platforms }}\` |"
            echo "| 是否推送 | \`${{ steps.target.outputs.push }}\` |"
            echo "| 镜像 digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "推送的标签："
            echo '```'
            printf '%s\n' "$META_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 容器级验证 ${{ matrix.arch }}
    needs: build
    # 只在真正推送过镜像时验证（PR 不推送，无从拉取）
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # 私有包需要凭据才能 pull
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            machine: x86_64
            port: 6892
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验镜像为 linux/amd64
        env:
          TARGET_TAG: ${{ needs.build.outputs.sha_tag }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -eu
          REF="${IMAGE_REF}:${TARGET_TAG}"

          # 权威校验：指定平台拉取，若该 tag 没有 amd64 变体将直接失败
          docker pull --platform linux/amd64 "$REF" >/dev/null
          ACTUAL="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")"
          echo "拉取到的镜像平台：${ACTUAL}"
          [ "${ACTUAL}" = "linux/amd64" ] \
            || { echo "::error::镜像平台为 ${ACTUAL}，期望 linux/amd64"; exit 1; }

          # 打印清单信息供排查（单平台为 image manifest，多平台为 index，两种形态都兼容）
          docker buildx imagetools inspect "$REF"

      - name: 真实启动容器并验证运行时不变式
        env:
          TARGET_TAG: ${{ needs.build.outputs.sha_tag }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          bash .github/scripts/container-check.sh \
            "${IMAGE_REF}:${TARGET_TAG}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.machine }}" \
            "${{ matrix.port }}" \
            --pull
